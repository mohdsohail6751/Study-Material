<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Lessons for Beginners</title>
<style>
:root{
  --bg:#f5f6fa;--card:#ffffff;--text:#1c2333;--muted:#5d677d;--line:#e3e6ee;
  --brand:#4f46e5;--brand-ink:#ffffff;--brand-soft:#eceeff;
  --teach:#eef4ff;--say:#eefaf1;--act:#fff7e6;--home:#f6efff;--can:#e8f7ee;
  --teach-ink:#1d4ed8;--say-ink:#15803d;--act-ink:#b45309;--home-ink:#7e22ce;--can-ink:#166534;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131c;--card:#1a1f2d;--text:#e8ebf3;--muted:#a3adc2;--line:#2a3144;
    --brand:#8b85ff;--brand-ink:#10131c;--brand-soft:#262b4a;
    --teach:#17233f;--say:#142a1d;--act:#33270f;--home:#251a38;--can:#14301f;
    --teach-ink:#8fb4ff;--say-ink:#7fe0a0;--act-ink:#f5c26b;--home-ink:#d2a8ff;--can-ink:#86e3a8;
  }
}
:root[data-theme="dark"]{
  --bg:#10131c;--card:#1a1f2d;--text:#e8ebf3;--muted:#a3adc2;--line:#2a3144;
  --brand:#8b85ff;--brand-ink:#10131c;--brand-soft:#262b4a;
  --teach:#17233f;--say:#142a1d;--act:#33270f;--home:#251a38;--can:#14301f;
  --teach-ink:#8fb4ff;--say-ink:#7fe0a0;--act-ink:#f5c26b;--home-ink:#d2a8ff;--can-ink:#86e3a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:0 0 8px}
h3{font-size:15px;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input{font:inherit;color:inherit}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.sm{padding:3px 10px;font-size:13px}
input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
nav.tabs,.stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
nav.tabs button,.stages button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected=true],.stages button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:3px 0}
details.lesson{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.lesson>summary{cursor:pointer;padding:12px 16px;display:flex;gap:10px;align-items:center;font-weight:700;list-style:none}
details.lesson>summary::-webkit-details-marker{display:none}
details.lesson>summary::after{content:"+";margin-left:auto;font-size:20px;color:var(--muted)}
details.lesson[open]>summary::after{content:"–"}
.tag{background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:1px 9px;font-size:13px;font-weight:700}
.body{padding:0 16px 16px}
.box{border-radius:10px;padding:10px 14px;margin-top:10px}
.box h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.box.teach{background:var(--teach)}.box.teach h4{color:var(--teach-ink)}
.box.say{background:var(--say)}.box.say h4{color:var(--say-ink)}
.box.act{background:var(--act)}.box.act h4{color:var(--act-ink)}
.box.home{background:var(--home)}.box.home h4{color:var(--home-ink)}
.box.can{background:var(--can)}.box.can h4{color:var(--can-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:15px}
.say-line{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.say-line button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;padding:0 8px;line-height:26px}
.say-line span{flex:1}
.goal{margin-top:2px}
.stage-head{margin:0 0 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);border-top:0}
.tablewrap{overflow-x:auto}
.empty{text-align:center;padding:30px}
@media print{
  body{background:#fff;color:#000}
  header,nav.tabs,.stages,.tools,.btn,.say-line button{display:none!important}
  details.lesson{break-inside:avoid;border-color:#bbb}
  details.lesson:not([open])>.body{display:block}
  body.print-one details.lesson:not(.printing){display:none}
  .box{border:1px solid #ccc;background:#fff!important}
}
@media (max-width:520px){ h1{font-size:19px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>English Lessons for Beginners</h1>
      <div class="muted small">49 simple lessons. They match the 8 stages in the Speaking Tracker.</div>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<script>
'use strict';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r=document) => r.querySelector(s);

/* ---------- Letter data (used by lessons A1, A2, A3, A5) ---------- */
// [letter, letter name, example word, sound]
const LETTERS = [
 ['A','ay','apple','a (as in apple)'],['B','bee','ball','buh'],['C','see','cat','kuh'],['D','dee','dog','duh'],
 ['E','ee','egg','eh'],['F','ef','fish','fff'],['G','jee','goat','guh'],['H','aitch','hat','huh'],
 ['I','eye','ink','ih'],['J','jay','jug','juh'],['K','kay','kite','kuh'],['L','el','lion','lll'],
 ['M','em','moon','mmm'],['N','en','nest','nnn'],['O','oh','orange','o (as in orange)'],['P','pee','pen','puh'],
 ['Q','kyoo','queen','kwuh'],['R','ar','rat','rrr'],['S','ess','sun','sss'],['T','tee','tap','tuh'],
 ['U','yoo','umbrella','uh'],['V','vee','van','vvv'],['W','double-yoo','web','wuh'],['X','ex','box','ks (as at the end of box)'],
 ['Y','why','yes','yuh'],['Z','zed','zebra','zzz']
];
const GROUPS = [[0,5],[5,10],[10,15],[15,20],[20,26]];
const grp = (fn) => GROUPS.map(([a,b]) => [`${LETTERS[a][0]} to ${LETTERS[b-1][0]}`, LETTERS.slice(a,b).map(fn)]);

/* ---------- Lessons ----------
   Fields: id (same as tracker skill id), t title, goal, teach, say, act, home, tip, can
   teach: array of strings, or array of [heading, [strings]] */
const L = {};
const add = o => { L[o.id] = o; };

/* ===== Stage 1 ===== */
add({id:'a1', t:'Capital letters A to Z', goal:'The student can see a capital letter and say its name.',
  teach: grp(x => `${x[0]} (${x[1]}) – ${x[2]}`),
  say:['This is A. A for apple.','What is this letter? It is B.','My name starts with ___.'],
  act:['Teach 5 letters per class. Do not rush.','Make flash cards. Show a card. The student says the letter name.','Say a letter. The student points to it on the chart.','Game: hide one card. Ask, "Which letter is missing?"'],
  home:'Say the alphabet from A to Z one time every day. Write each new letter 3 times.',
  tip:'A letter has a name (like "bee") and a sound (like "buh"). In this lesson, teach the name only. Sounds come in lesson A3.',
  can:'The student reads any 10 capital letters you point to, with no help, in 2 different classes.'});

add({id:'a2', t:'Small letters a to z', goal:'The student knows the small letter for every capital letter.',
  teach: grp(x => `${x[0]}${x[0].toLowerCase()} – ${x[2]}`).concat([['Letters that look the same','b and d, p and q, m and n, u and n']]),
  say:['Big A, small a.','This is small b.','Which one is small d?'],
  act:['Make two sets of cards: capital and small. The student matches the pairs.','Write a word on the board in small letters. Ask the student to find each letter on the chart.','Show b and d side by side. Say: "b has the belly on the right. d has the belly on the left."'],
  home:'Write the whole alphabet as pairs: Aa Bb Cc Dd… Do it two times this week.',
  tip:'Most students mix up b/d and p/q. Do not worry. Practise them again and again, a little each day.',
  can:'The student matches all 26 pairs (capital and small) without mistakes.'});

add({id:'a3', t:'Letter sounds (phonics)', goal:'The student knows the sound of each letter.',
  teach: grp(x => `${x[0]} says "${x[3]}" – ${x[2]}`),
  say:['A says "a". Apple.','B says "buh". Ball.','What sound does S make? "sss".'],
  act:['Say each sound short and clear. Say "buh", not "bee".','You say the sound. The student says it after you. Then the student says it alone.','Game: say a sound. The student says a word that starts with that sound.','Show a picture (a cat). Ask, "What is the first sound?"'],
  home:'Say the 26 sounds with the chart. Do 5 sounds per day. Look around the house and find 3 things for each new sound.',
  tip:'Use a mirror. The student can see your mouth. Let the student feel the air with a hand for sounds like "puh" and "tuh".',
  can:'The student says the correct sound for any 15 letters you point to.'});

add({id:'a4', t:'Vowels: A E I O U', goal:'The student knows the 5 vowels and their two sounds.',
  teach:[['The 5 vowels',['A','E','I','O','U']],
         ['Short sounds',['a – cat','e – bed','i – pig','o – dog','u – sun']],
         ['Long sounds (the letter says its name)',['a – cake','e – tree','i – bike','o – nose','u – cube']],
         ['Note','All the other 21 letters are called consonants.']],
  say:['A, E, I, O, U are vowels.','Cat has the vowel a.','Is "b" a vowel? No, it is a consonant.'],
  act:['Chant the vowels together: A, E, I, O, U.','Say a word. The student tells you the vowel: "pig" → "i".','Write 5 short words on cards. The student circles the vowel in each word.'],
  home:'Find 5 words at home. Write each word and circle the vowel.',
  tip:'Every English word has at least one vowel sound. This is a good fact to repeat.',
  can:'The student says all 5 vowels and finds the vowel in 5 new words.'});

add({id:'a5', t:'Spelling my own name', goal:'The student can say and write their name, and spell it aloud.',
  teach:[['Letter names to use when spelling',LETTERS.map(x => `${x[0]} = ${x[1]}`)],
         ['Steps',['1. Write the name on the board.','2. Say the name.','3. Say the letters one by one.','4. Cover the board. The student spells it from memory.']]],
  say:['What is your name? My name is ___.','How do you spell your name?','A-L-I. (Say each letter name slowly.)','Can you spell your father\'s name?'],
  act:['Make name cards with big letters. Cut them up. The student puts the letters in the right order.','Spell the names of family members.','Take turns: you spell a name, the student says the name. Then change.'],
  home:'Write your name 10 times. Spell it aloud to a family member. Spell their names too.',
  tip:'Spelling names is very useful on the phone, at a bank, and at a hotel. Tell the student this. It makes the student want to learn.',
  can:'The student spells their own name and 3 other names aloud without help.'});

add({id:'a6', t:'Reading simple 3-letter words', goal:'The student can read short words by joining the sounds.',
  teach:[['Words with a',['cat','bat','hat','mat','rat']],['Words with e',['pen','hen','ten','net','bed']],
         ['Words with i',['pin','sit','big','lip','fin']],['Words with o',['dog','pot','hot','top','box']],
         ['Words with u',['sun','cup','bus','mud','run']],
         ['How to blend',['Say each sound: c … a … t','Say it faster: ca … t','Say the word: cat']]],
  say:['The cat sat.','A dog is big.','I have a pen.','The sun is hot.'],
  act:['Point to each letter. The student says the sound. Slide your finger and the student says the whole word.','Word match: put pictures on one side and word cards on the other. The student matches them.','Change one letter: cat → hat → mat → mad. Ask, "What changed?"'],
  home:'Read 10 words from the list every day. Write 5 of them from memory.',
  tip:'If the student guesses the word, stop. Say, "Sound it out." Guessing is not reading.',
  can:'The student reads 15 new 3-letter words without help.'});

/* ===== Stage 2 ===== */
add({id:'b1', t:'Numbers 1 to 10', goal:'The student can count and say numbers from 1 to 10.',
  teach:[['Numbers',['1 – one','2 – two','3 – three','4 – four','5 – five','6 – six','7 – seven','8 – eight','9 – nine','10 – ten']]],
  say:['I have two books.','How many pens? Three pens.','I am ten years old.','Count with me: one, two, three.'],
  act:['Count real things: pens, coins, fingers.','Show a number card. The student says it.','Say a number. The student shows that many fingers.','Ask "How many?" about things in the room.'],
  home:'Count things at home each day: chairs, cups, doors. Say the numbers in English.',
  tip:'Say "th" in three with the tongue between the teeth. Show it slowly.',
  can:'The student counts 1 to 10 forwards and backwards, and says any number you show.'});

add({id:'b2', t:'Numbers 11 to 100', goal:'The student can say big numbers.',
  teach:[['11 to 20',['11 eleven','12 twelve','13 thirteen','14 fourteen','15 fifteen','16 sixteen','17 seventeen','18 eighteen','19 nineteen','20 twenty']],
         ['Tens',['30 thirty','40 forty','50 fifty','60 sixty','70 seventy','80 eighty','90 ninety','100 one hundred']],
         ['Mixed numbers',['21 twenty-one','34 thirty-four','58 fifty-eight','99 ninety-nine']],
         ['Be careful',['"teen" (stress at the end): fifteen','"ty" (stress at the start): fifty']]],
  say:['I am twenty-five years old.','It costs fifty rupees.','My phone number is ...','There are thirty students.'],
  act:['Bingo: write 9 numbers on a card. Call numbers. The student marks them.','Say two numbers. The student says which one is bigger.','Dictation: say a number. The student writes it.'],
  home:'Say the phone numbers of 3 family members in English. Count from 1 to 100 in tens.',
  tip:'Fifteen and fifty sound alike. Practise them next to each other every class.',
  can:'The student reads and says any number from 1 to 100 correctly 8 times out of 10.'});

add({id:'b3', t:'Days of the week', goal:'The student can say the 7 days in order and use them in sentences.',
  teach:[['The 7 days',['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday']],
         ['Useful words',['today','tomorrow','yesterday','weekend (Saturday and Sunday)']]],
  say:['Today is Monday.','Tomorrow is Tuesday.','Yesterday was Sunday.','I go to work on Monday.','What day is it today?'],
  act:['Chant the days like a song, then say them faster.','Draw a calendar. Point to a day. The student says it.','Ask, "What day comes after Friday?"','Ask, "What do you do on Sunday?"'],
  home:'Every morning say: "Today is ___. Tomorrow is ___."',
  tip:'Do not worry about the spelling of Wednesday yet. Say it as "Wenz-day".',
  can:'The student says the days in order, without help, and answers "What day is it today?".'});

add({id:'b4', t:'Months of the year', goal:'The student can say the 12 months and talk about a birthday.',
  teach:[['The 12 months',['January','February','March','April','May','June','July','August','September','October','November','December']],
         ['Seasons',['summer (hot)','winter (cold)','rainy season','spring','autumn']]],
  say:['My birthday is in May.','It is hot in June.','What month is it now?','I was born in ___.','The first month is January.'],
  act:['Make a year chart. Point to months and say them.','Go around the room (or family): "When is your birthday?"','Ask, "Which month do you like? Why?"'],
  home:'Write the months in order. Say the birthday month of 5 people you know.',
  tip:'Teach "in" for months: in May, in June. This small rule is very useful.',
  can:'The student says all 12 months in order and says, "My birthday is in ___."'});

add({id:'b5', t:'Colours', goal:'The student knows the main colours.',
  teach:[['Colours',['red','blue','green','yellow','black','white','orange','pink','purple','brown','grey']]],
  say:['The sky is blue.','What colour is it? It is red.','I like green.','My bag is black.','The banana is yellow.'],
  act:['Show coloured things. Ask, "What colour is this?"','Play "I spy": "I see something red."','Ask the student to find 3 yellow things in the room.'],
  home:'Look at your clothes and your house. Say the colour of 10 things in English.',
  tip:'Use real objects, not only a chart. Real things stay in memory longer.',
  can:'The student names 10 colours and uses them in a full sentence.'});

add({id:'b6', t:'Telling the time', goal:'The student can ask and tell the time on the hour and the half hour.',
  teach:[['On the hour',['1:00 – It is one o\'clock.','5:00 – It is five o\'clock.','12:00 – It is twelve o\'clock.']],
         ['Half hour',['5:30 – It is half past five.','8:30 – It is half past eight.']],
         ['Question',['What time is it?','What time do you wake up?']],
         ['Day parts',['in the morning','in the afternoon','in the evening','at night']]],
  say:['What time is it? It is five o\'clock.','It is half past six.','I wake up at six o\'clock.','I go to bed at ten o\'clock at night.'],
  act:['Use a paper clock with moving hands. Show a time. The student says it.','Say a time. The student moves the hands.','Ask the student about daily times: "What time do you eat dinner?"'],
  home:'Look at a clock 5 times a day. Say the time in English.',
  tip:'Teach only the hour and the half hour now. Quarter past and quarter to can come later.',
  can:'The student reads 8 different clock times correctly and says, "I wake up at ___."'});

/* ===== Stage 3 ===== */
add({id:'c1', t:'Greetings and goodbyes', goal:'The student can say hello and goodbye in the right way for the time of day.',
  teach:[['Hello',['Hello','Hi (friendly)','Good morning (until 12 noon)','Good afternoon (12 noon to 5 pm)','Good evening (after 5 pm)']],
         ['Goodbye',['Goodbye','Bye','See you tomorrow','See you later','Take care','Good night (only when going to sleep)']]],
  say:['Hello, teacher!','Good morning! Good afternoon! Good evening!','Goodbye. See you tomorrow.','Good night. Sleep well.'],
  act:['Role play: you are a friend. Meet the student in the morning, afternoon and evening.','Show a clock. The student chooses the right greeting.','Practise a goodbye at the end of every class.'],
  home:'Greet 3 people in English today. Say "Good morning" or "Hello".',
  tip:'"Good night" is not a greeting. It is only for the end of the day. Explain this once, clearly.',
  can:'The student uses the correct greeting for morning, afternoon and evening, and says goodbye correctly.'});

add({id:'c2', t:'How are you? I am fine.', goal:'The student can ask and answer how someone is.',
  teach:[['Question',['How are you?','How are you today?']],
         ['Answers',['I am fine, thank you.','I am good.','I am great!','I am OK.','I am tired.','I am not good.']],
         ['Always ask back',['And you?','How about you?']]],
  say:['How are you? I am fine, thank you. And you?','I am good, thanks.','I am tired today.','I am happy.'],
  act:['Start every class with this talk.','Draw faces (happy, OK, tired, sad). Point to a face. The student says how they feel.','Practise this dialogue two times with each person: Hello. How are you? I am fine, thank you. And you?'],
  home:'Ask 2 people "How are you?" in English today. Listen to their answer.',
  tip:'In real life, people often say "Fine, thanks" without thinking. It is a habit, so make it a habit for the student too.',
  can:'The student asks "How are you?", answers, and asks "And you?" without help.'});

add({id:'c3', t:'My name is… / What is your name?', goal:'The student can say their name and ask for someone else\'s name.',
  teach:[['Questions',['What is your name?','What is his name?','What is her name?']],
         ['Answers',['My name is ___.','I am ___.','His name is ___.','Her name is ___.']],
         ['Meeting someone',['Nice to meet you.','Nice to meet you too.']]],
  say:['Hello, my name is Sara. What is your name?','Nice to meet you.','Nice to meet you too.','This is my friend. His name is Ali.'],
  act:['Walk-around game: the student meets 3 "people" (you, a toy, a photo) and asks each one their name.','Show pictures of people. Ask, "What is her name?"','Practise the full talk: Hello. My name is ___. What is your name? Nice to meet you.'],
  home:'Say this talk to a mirror or a family member: "Hello, my name is ___. Nice to meet you."',
  tip:'Teach "My name is…" first. "I am…" is shorter, but learn the full one first.',
  can:'The student has a complete meeting talk (greeting, name, nice to meet you) without help.'});

add({id:'c4', t:'Where are you from? Where do you live?', goal:'The student can say their country, city, and where they live.',
  teach:[['Questions',['Where are you from?','Where do you live?','Do you live in a house or a flat?']],
         ['Answers',['I am from ___. (country)','I live in ___. (city or town)','I live in a house.','I live with my family.']],
         ['Useful words',['country','city','town','village','near','far']]],
  say:['Where are you from? I am from Pakistan.','I live in a small town.','I live with my parents.','My house is near the market.'],
  act:['Show a map. The student points to their country and city.','Ask the same questions about other people or famous places.','Talk about the student\'s home: "Is your house big or small?"'],
  home:'Write 3 sentences: "I am from ___. I live in ___. I live with ___."',
  tip:'Use the real country and city of the student. Real facts are easy to remember.',
  can:'The student answers both questions in full sentences and asks them back.'});

add({id:'c5', t:'Please, thank you, sorry, excuse me', goal:'The student can use polite words in daily life.',
  teach:[['Polite words',['Please','Thank you','Thank you very much','You are welcome','Sorry','I am sorry','Excuse me','Pardon?']],
         ['When to use them',['Please – when you ask for something','Thank you – when someone helps you','Sorry – when you make a mistake','Excuse me – to get attention or to pass someone']]],
  say:['Can I have some water, please?','Thank you very much. You are welcome.','I am sorry. I am late.','Excuse me, where is the bathroom?','Sorry? Please say it again.'],
  act:['Role play: ask for a pen. Say "Please" and "Thank you".','Make small scenes: you step on a foot (sorry), you need to pass (excuse me), someone gives a gift (thank you).','Give the student a card with a situation. The student says the polite words.'],
  home:'Use "please" and "thank you" in English for one full day, in your head or aloud.',
  tip:'Polite words make the student sound kind and confident. Praise every time the student uses them.',
  can:'The student uses all 4 polite words correctly in 5 different small role plays.'});

add({id:'c6', t:'My 5-line introduction', goal:'The student can introduce themselves in 5 clear lines.',
  teach:[['The 5 lines',['1. My name is ___.','2. I am ___ years old.','3. I am from ___.','4. I live in ___.','5. I like ___.']],
         ['Extra lines (when ready)',['I am a student.','I work as a ___.','I have ___ brothers and sisters.','I want to learn English because ___.']]],
  say:['Hello. My name is Ali. I am twenty years old. I am from Lahore. I live in Lahore. I like cricket.','I am a student. I want to learn English.'],
  act:['Write the 5 lines with blanks. The student fills in the blanks.','The student says the lines while looking at the page. Then with the page covered.','Record the student on a phone. Play it back. Record again next month. Compare.'],
  home:'Say your introduction to 3 different people this week.',
  tip:'This is the first big win. Celebrate it. A student who can introduce themselves feels like a speaker.',
  can:'The student says all 5 lines smoothly, with no page, in 2 different classes.'});

/* ===== Stage 4 ===== */
add({id:'d1', t:'Family members', goal:'The student can name family members and talk about their own family.',
  teach:[['People',['mother','father','brother','sister','grandmother','grandfather','uncle','aunt','son','daughter','husband','wife','cousin']],
         ['Groups',['parents = mother and father','children = sons and daughters','family']]],
  say:['This is my mother.','I have two brothers and one sister.','My father is tall.','My grandmother lives with us.','How many people are in your family?'],
  act:['Draw a family tree. Write the English word on each person.','Use family photos. Ask, "Who is this?"','Ask the student to tell you about 3 people in their family.'],
  home:'Write 5 sentences about your family. Start each with "My ___".',
  tip:'Use "my" often: my mother, my father. It builds a good habit.',
  can:'The student names 10 family members and says 4 sentences about their own family.'});

add({id:'d2', t:'Parts of the body', goal:'The student knows the main body parts.',
  teach:[['Head and face',['head','hair','eye','ear','nose','mouth','tooth (one) / teeth (many)']],
         ['Body',['neck','shoulder','arm','hand','finger','stomach','back']],
         ['Legs',['leg','knee','foot (one) / feet (two)','toe']]],
  say:['I have two eyes.','This is my nose.','My head hurts.','Touch your ears.','I wash my hands.'],
  act:['Play "Simon says": "Touch your nose." "Touch your knee."','Point to a part. The student names it.','Draw a person. The student labels each part.'],
  home:'Touch each body part. Say its name in English. Do this once a day for a week.',
  tip:'Teach the odd plurals: one foot, two feet. One tooth, two teeth.',
  can:'The student names 15 body parts and follows 5 "touch your…" commands.'});

add({id:'d3', t:'Food and drinks', goal:'The student can name common food and say what they eat and drink.',
  teach:[['Food',['rice','bread','egg','chicken','fish','meat','potato','onion','tomato','apple','banana','salt','sugar']],
         ['Drinks',['water','milk','tea','coffee','juice']],
         ['Meals',['breakfast','lunch','dinner']]],
  say:['I eat rice.','I drink tea.','Do you like milk?','I have eggs for breakfast.','What do you eat for dinner?'],
  act:['Use real food or pictures. Ask, "What is this?"','Ask, "What do you eat for breakfast? For lunch? For dinner?"','Make a menu. The student says what they want.'],
  home:'Write what you eat and drink in one day. Use English words.',
  tip:'Use "eat" with food and "drink" with drinks. Make a two-column chart to show this.',
  can:'The student names 15 food and drink words and tells you 3 sentences about their meals.'});

add({id:'d4', t:'Things in the house', goal:'The student can name things in the home and say where they are.',
  teach:[['Rooms',['house','room','kitchen','bathroom','bedroom']],
         ['Things',['door','window','table','chair','bed','fan','light','TV','phone','bag','key','clock','cup','plate','spoon']],
         ['Where? (small words)',['in','on','under','next to']]],
  say:['The key is on the table.','The phone is in my bag.','The cat is under the chair.','There is a fan in my room.','Where is the clock?'],
  act:['Walk around the room. Point and say the name of each thing.','Hide a small object. Give clues: "It is under the book."','Draw a room. Ask the student to describe it.'],
  home:'Walk through your house. Name 15 things in English. Write 5 sentences with "in", "on" or "under".',
  tip:'Use "in / on / under" with real objects. A pen on a book, in a bag, under a table.',
  can:'The student names 15 things in the house and says where 5 objects are.'});

add({id:'d5', t:'Animals', goal:'The student knows common animals and can describe them in a simple way.',
  teach:[['Animals',['cat','dog','cow','horse','goat','sheep','hen','bird','fish','lion','elephant','monkey','tiger','rabbit','snake']],
         ['Describing words',['big','small','fast','slow','strong']],
         ['A or An?',['A before a consonant sound: a cat, a dog','An before a vowel sound: an elephant, an apple']]],
  say:['A cat is small.','An elephant is big.','A rabbit is fast.','I have a dog.','My favourite animal is the lion.'],
  act:['Show pictures. The student says the animal and one describing word.','Act like an animal. The student guesses.','Ask, "Which animal is big? Which is small?"'],
  home:'Write 5 sentences about 5 animals: "A ___ is ___."',
  tip:'Use this lesson to teach "a" and "an". Say them together with the word, as one piece: "an elephant".',
  can:'The student names 12 animals and uses "a" or "an" correctly in 5 sentences.'});

add({id:'d6', t:'Common action words (verbs)', goal:'The student knows 20 common action words.',
  teach:[['Action words',['go','come','eat','drink','sleep','wake up','sit','stand','walk','run','read','write','speak','listen','see','give','take','open','close','play','work']]],
  say:['I go to school.','She eats rice.','They play cricket.','I read a book.','Please open the door.'],
  act:['Act out a verb. The student says it.','Say a verb. The student acts it.','Give a card with a verb. The student makes a short sentence: "I ___."'],
  home:'Write 10 verbs and make 1 short sentence for each. Example: "I sleep at night."',
  tip:'Action words are the most useful words. Teach them with movement. The body helps the memory.',
  can:'The student says and uses 15 verbs in short sentences.'});

add({id:'d7', t:'Opposites', goal:'The student knows pairs of opposite words.',
  teach:[['Opposite pairs',['big – small','hot – cold','tall – short','fast – slow','old – new','young – old','happy – sad','easy – hard','open – close','good – bad','clean – dirty','near – far','up – down','day – night','heavy – light']]],
  say:['The elephant is big. The mouse is small.','Tea is hot. Ice is cold.','This test is easy. That test is hard.','My room is clean.','The shop is near. The school is far.'],
  act:['Say a word. The student says the opposite.','Match game: cards with words on one side and their opposites on the other.','Describe two things: "The car is fast. The bicycle is slow."'],
  home:'Learn 5 pairs each day. Say a sentence for each pair.',
  tip:'Always teach in pairs. Opposites help the student remember two words at once.',
  can:'The student says the opposite of any 12 words from the list.'});

/* ===== Stage 5 ===== */
add({id:'e1', t:'I am, you are, he is, she is', goal:'The student can use am, is and are correctly with each person.',
  teach:[['The pattern',['I am','you are','he is','she is','it is','we are','they are']],
         ['Short forms',['I am = I\'m','you are = you\'re','he is = he\'s','she is = she\'s']],
         ['Wrong (never say)',['I is','He are','You is','They is']]],
  say:['I am a teacher.','You are my friend.','He is tall.','She is happy.','We are students.','They are at home.'],
  act:['Point to yourself, the student, a man in a photo, a woman in a photo, a group. The student says the right sentence.','Fill the blank: "She ___ happy." (is)','Make 5 sentences about yourself: "I am ___."'],
  home:'Write 2 sentences for each: I, you, he, she, we, they.',
  tip:'Teach one pronoun at a time. I am first. Then add the others slowly. Use the same sentence: "___ happy."',
  can:'The student uses am, is and are correctly in 10 sentences.'});

add({id:'e2', t:'This is / That is / These are / Those are', goal:'The student can talk about things near and far.',
  teach:[['One thing',['this is = near me','that is = far from me']],
         ['More than one',['these are = near me','those are = far from me']]],
  say:['This is a pen.','That is a car.','These are my books.','Those are birds.','What is this? What is that?'],
  act:['Hold an object: "This is a pen." Point to something far away: "That is a clock."','Do the same with two or more objects: "These are pens." "Those are windows."','Ask, "What is this?" and "What are these?"'],
  home:'Walk around your house. Say 5 sentences with "this is" and 5 with "that is".',
  tip:'Use your hand: touch for "this", point far for "that". The gesture makes the idea clear.',
  can:'The student uses this, that, these and those correctly in 8 sentences.'});

add({id:'e3', t:'I have / I do not have', goal:'The student can say what they have and do not have.',
  teach:[['Have',['I have','you have','we have','they have','he has','she has']],
         ['Do not have',['I do not have a car.','He does not have a phone.']],
         ['Question',['Do you have a pen?','Yes, I do.','No, I do not.']]],
  say:['I have a bike.','She has two sisters.','I do not have a car.','Do you have a pen? Yes, I do.','He has a big house.'],
  act:['Show objects and say what you have. Ask, "Do you have a pen?"','Ask the student about family and things: "Do you have a brother?"','Play a quiz: each student card says "I have ___" and you ask questions.'],
  home:'Write 5 things you have and 3 things you do not have.',
  tip:'He and she take "has", not "have". Say it again and again in every class.',
  can:'The student uses have and has correctly and answers "Do you have…?" with a short answer.'});

add({id:'e4', t:'I like / I do not like', goal:'The student can say what they like and do not like.',
  teach:[['Like',['I like tea.','You like cricket.','She likes cats.','He likes rice.']],
         ['Do not like',['I do not like cold water.','He does not like fish.']],
         ['Stronger words',['I love ___','I hate ___ (very strong, be careful)']],
         ['Question',['Do you like pizza?','Yes, I do. / No, I do not.']]],
  say:['I like tea.','I do not like coffee.','She likes cats.','Do you like pizza? Yes, I do.','I love my family.'],
  act:['Show pictures of food, sports, animals. The student says "I like it" or "I do not like it".','Ask the student 10 "Do you like…?" questions.','Ask, "What do you like? What do you not like?" and write down the answers.'],
  home:'Write 5 things you like and 5 things you do not like. Say them aloud.',
  tip:'"I like" is a good way to start real conversations. Use real likes and dislikes of the student.',
  can:'The student says 5 likes and 3 dislikes and answers "Do you like…?" questions.'});

add({id:'e5', t:'I want / I need', goal:'The student can say what they want and need, and ask politely.',
  teach:[['Want and need',['I want water.','I need help.','I want to eat.','I need to go.']],
         ['He and she',['He wants a phone.','She needs a pen.']],
         ['Polite way',['I would like some tea, please.','Can I have a glass of water, please?']]],
  say:['I want a glass of water.','I need a pen.','I want to learn English.','I need to go home.','I would like some tea, please.'],
  act:['Role play: you are a shopkeeper. The student asks for things using "I want…" then "I would like…".','Give the student a card: "You are hungry." The student says, "I want to eat."','Practice: "I want ___ because ___."'],
  home:'Write 5 sentences: "I want…" and 5 sentences: "I need…".',
  tip:'"I want" can sound strong. Teach "I would like…, please" early for shops and restaurants.',
  can:'The student uses want, need and "I would like" in 8 correct sentences.'});

add({id:'e6', t:'Am, is, are: negatives and questions', goal:'The student can make "not" sentences and questions with am, is and are.',
  teach:[['Negative (add "not")',['I am not tired.','He is not at home.','They are not students.']],
         ['Question (put the verb first)',['Are you ready?','Is she a teacher?','Is it hot?']],
         ['Short answers',['Yes, I am.','No, I am not.','Yes, she is.','No, they are not.']]],
  say:['I am not hungry.','She is not at school.','Are you a student? Yes, I am.','Is it cold? No, it is not.','Are they at home? Yes, they are.'],
  act:['Say a sentence. The student makes it negative: "He is tall." → "He is not tall."','Say a sentence. The student makes it a question: "You are happy." → "Are you happy?"','Play a yes/no game with pictures.'],
  home:'Write 5 sentences. Change each to a negative and to a question.',
  tip:'Use the same sentence for all three forms. Example: "She is happy. She is not happy. Is she happy?"',
  can:'The student makes negatives and questions correctly with am, is and are in 10 sentences.'});

/* ===== Stage 6 ===== */
add({id:'f1', t:'What, Where, Who', goal:'The student can ask and answer questions with what, where and who.',
  teach:[['What (a thing)',['What is this?','What is your name?','What do you do?']],
         ['Where (a place)',['Where is the bag?','Where do you live?','Where are you from?']],
         ['Who (a person)',['Who is he?','Who is your teacher?','Who is that woman?']]],
  say:['What is this? It is a pen.','Where is the bag? It is on the chair.','Who is he? He is my brother.','What do you do? I am a student.'],
  act:['Show an object. Ask "What is this?"','Hide an object. Ask "Where is it?"','Show a photo of a person. Ask "Who is this?"','Match question words to answers: "Where…?" → a place. "Who…?" → a person.'],
  home:'Write 3 questions for each word (what, where, who). Ask a family member and write the answers.',
  tip:'Tell the student: each question word wants one kind of answer. What = thing, where = place, who = person.',
  can:'The student asks and answers 3 questions with each word without help.'});

add({id:'f2', t:'When, Why, How', goal:'The student can ask and answer questions with when, why and how.',
  teach:[['When (a time)',['When is your birthday?','When do you wake up?']],
         ['Why (a reason; answer with "because")',['Why are you late? Because the bus was late.','Why do you like tea? Because it is hot and sweet.']],
         ['How (a way, or number)',['How are you?','How old are you?','How do you go to work?','How much is this?','How many brothers do you have?']]],
  say:['When is your birthday? It is in May.','Why are you happy? Because it is Friday.','How old are you? I am twenty.','How much is this? It is fifty rupees.','How many brothers do you have? I have two.'],
  act:['Ask a question from the list. The student answers.','Give the student a set of question cards. The student asks you.','Teach "because": say a sentence, ask "Why?", and help the student answer with "Because…".'],
  home:'Write 2 questions for when, why, and how. Ask 2 people and write the answers.',
  tip:'Teach "How much" for price and "How many" for number. Use real things: coins, pens.',
  can:'The student asks and answers questions with when, why and how in a short talk.'});

add({id:'f3', t:'Yes/No questions', goal:'The student can ask and answer questions that need "yes" or "no".',
  teach:[['Starting words',['Do you ___?','Does he/she ___?','Is it ___?','Are you ___?','Can you ___?']],
         ['Examples',['Do you like tea?','Does she work?','Is it hot?','Can you swim?']],
         ['Answers',['Yes, I do. / No, I do not.','Yes, she does. / No, she does not.','Yes, it is. / No, it is not.','Yes, I can. / No, I cannot.']]],
  say:['Do you like tea? Yes, I do.','Does she work? No, she does not.','Is it hot today? Yes, it is.','Can you swim? No, I cannot.'],
  act:['Ask 10 quick yes/no questions. The student answers with the short answer, not only "yes".','The student asks you 5 questions. Answer, and see if the question is right.','Game: think of an animal. The student asks yes/no questions to find it.'],
  home:'Write 10 yes/no questions you can ask a friend. Ask 3 of them.',
  tip:'Teach the "short answer" (Yes, I do.) early. It sounds more natural than only "Yes."',
  can:'The student asks and answers 8 yes/no questions with the right short answers.'});

add({id:'f4', t:'Answer the question directly', goal:'The student gives a clear answer, then adds one more sentence.',
  teach:[['The 2-step method',['Step 1: Answer the question.','Step 2: Add one more sentence.']],
         ['Example',['Q: Where do you live?','A: I live in Lahore. It is a big city.']],
         ['More practice',['Q: Do you like tea? A: Yes, I do. I drink it every morning.','Q: What do you do? A: I am a student. I study at a college.','Q: What is your favourite food? A: I like biryani. It is very tasty.']]],
  say:['I live in Karachi. It is a big city.','Yes, I do. I drink it every morning.','I am a student. I study computers.'],
  act:['Ask 10 easy questions. The student answers with the 2-step method.','Give a point when the student adds the second sentence on their own.','Swap roles. The student asks, you answer.'],
  home:'Choose 5 questions from this lesson. Write 2-sentence answers. Say them aloud.',
  tip:'This is how real talking grows. Short answers end a talk. Two sentences keep it going.',
  can:'The student gives 2-sentence answers to 8 questions without help.'});

add({id:'f5', t:'When I do not understand', goal:'The student knows what to say when they do not understand or cannot find a word.',
  teach:[['If you did not hear',['Sorry? / Pardon?','Please say it again.','Can you repeat that?','Please speak slowly.']],
         ['If you did not understand',['I do not understand.','What does ___ mean?','Can you explain?']],
         ['If you need a word',['How do you say ___ in English?','How do you spell it?','Just a moment, please.']]],
  say:['Sorry? Please say it again.','Please speak slowly.','I do not understand.','What does "tired" mean?','How do you say this word in English?'],
  act:['Speak fast on purpose. The student must use a phrase to ask you to repeat.','Say a new word. The student asks, "What does ___ mean?"','Put phrase cards on the table. Point to one. The student says it.'],
  home:'Learn 3 phrases each day. Say them to yourself in the mirror.',
  tip:'These phrases are very powerful. A student who can ask for help never feels stuck. Allow your student to use them all the time.',
  can:'The student uses 6 of these phrases without help in a normal talk.'});

/* ===== Stage 7 ===== */
add({id:'g1', t:'My daily routine', goal:'The student can describe a normal day in order.',
  teach:[['Morning',['I wake up at six o\'clock.','I brush my teeth.','I take a bath.','I eat breakfast.']],
         ['Day',['I go to work. / I go to school.','I eat lunch.','I come home.']],
         ['Evening and night',['I eat dinner.','I watch TV.','I go to sleep.']],
         ['Joining words',['first','then','after that','in the morning','in the afternoon','in the evening','at night']],
         ['He and she',['He wakes up. She goes to work. (add s)']]],
  say:['I wake up at six. Then I brush my teeth.','After that, I eat breakfast.','In the evening, I watch TV.','At night, I go to sleep.'],
  act:['Put pictures of a day in the wrong order. The student puts them in order and says each one.','Ask the student: "What do you do in the morning?"','Ask about another person: "What does your father do in the morning?"'],
  home:'Write 8 sentences about your day. Use "first", "then", "after that". Say them aloud.',
  tip:'Use time words (first, then, after that). They help the student speak in order, without stopping.',
  can:'The student describes a normal day in 8 or more sentences.'});

add({id:'g2', t:'At a shop', goal:'The student can ask for things and ask about the price.',
  teach:[['Asking about price',['How much is this?','How much are these?','It is fifty rupees.']],
         ['Asking for things',['Do you have a bigger one?','Do you have this in blue?','Can I have two kilos of rice?','Can I see that, please?']],
         ['Deciding',['That is too expensive.','Can you give me a discount?','I will take it.','No, thank you. I am just looking.']]],
  say:['How much is this? It is fifty rupees.','Do you have a bigger one?','That is too expensive.','Can you give me a discount?','I will take it. Thank you.'],
  act:['Set up a small shop with real things and price tags. You are the shopkeeper. The student is the customer.','Swap roles. The student sells.','Add a problem: "The shirt is too small." The student must ask for another size.'],
  home:'Go to a shop and, in your head, say what you want in English. Write 5 questions you can ask.',
  tip:'Role plays with real things are the best way to learn this. Use play money.',
  can:'The student buys 3 things in a role play, asks about price, and is polite.'});

add({id:'g3', t:'At a restaurant', goal:'The student can order food and pay.',
  teach:[['Arriving',['A table for two, please.','Can I see the menu, please?']],
         ['Ordering',['I would like chicken and rice, please.','Can I have some water, please?','What do you have for dessert?']],
         ['During the meal',['The food is very good.','Can I have some more?']],
         ['Paying',['Can I have the bill, please?','Thank you. The food was great.']]],
  say:['A table for two, please.','I would like chicken and rice, please.','Can I have some water?','Can I have the bill, please?'],
  act:['Make a paper menu. You are the waiter. The student orders a full meal.','Add a problem: "The food is cold." The student must complain politely: "Excuse me, the food is cold."','Swap roles.'],
  home:'Write your own favourite order in English. Learn the 4 phrases for arriving and paying.',
  tip:'Use "I would like…" here. It is the polite way, and the student already learned it in lesson E5.',
  can:'The student completes a full restaurant role play from arrival to paying.'});

add({id:'g4', t:'Asking for and giving directions', goal:'The student can ask the way and give simple directions.',
  teach:[['Asking',['Excuse me, where is the bank?','How do I get to the station?','Is it far from here?']],
         ['Directions',['Go straight.','Turn left.','Turn right.','Stop at the corner.']],
         ['Places',['next to','opposite','behind','in front of','near','at the corner']]],
  say:['Excuse me, where is the bank?','Go straight. Turn left.','It is next to the school.','It is opposite the park.','Thank you very much.'],
  act:['Draw a simple map on paper with a school, bank, shop, park. Use a toy car. Ask, "Where is the bank?" The student gives directions.','Walk around the building. The student gives you directions.','Swap: the student asks and follows your directions on the map.'],
  home:'Describe the way from your house to a shop in 5 sentences.',
  tip:'Use a real map of the student\'s own area. Then the words are real.',
  can:'The student gives directions between 2 places in 4 sentences and asks the way correctly.'});

add({id:'g5', t:'Basic phone talk', goal:'The student can start, hold and end a simple phone call.',
  teach:[['Starting',['Hello, this is Ali.','Hello, can I speak to Sara, please?','Who is calling?']],
         ['In the middle',['Please hold on.','She is not here.','Can I leave a message?']],
         ['Ending',['I will call you back.','Thank you for calling. Goodbye.']],
         ['Problems',['The line is bad.','Please speak louder.','Sorry, wrong number.']]],
  say:['Hello, this is Ali.','Can I speak to Sara, please?','She is not here. Can I leave a message?','I will call you back. Goodbye.'],
  act:['Sit back to back, or use two phones. The student calls you.','Use scripts first. Then try without the page.','Add a problem: "I cannot hear you." The student must say, "Please speak louder."'],
  home:'Learn the opening and the ending phrases. Practise a call with a family member.',
  tip:'Phone talk is hard because there is no face to see. Speak slowly at first, then speed up.',
  can:'The student makes a short call (start, ask for a person, end) without a script.'});

add({id:'g6', t:'Past tense', goal:'The student can talk about things that happened.',
  teach:[['Time words',['yesterday','last night','last week','two days ago']],
         ['Regular verbs (add -ed)',['walk – walked','play – played','work – worked','watch – watched','clean – cleaned']],
         ['Irregular verbs (learn each one)',['go – went','eat – ate','see – saw','have – had','come – came','take – took','buy – bought','drink – drank','sleep – slept','make – made']],
         ['Negative and question (use did)',['I did not go.','Did you go? Yes, I did. No, I did not.']]],
  say:['Yesterday I went to the market.','I ate rice for lunch.','She played cricket.','Did you watch TV? Yes, I did.','I did not sleep well last night.'],
  act:['Ask, "What did you do yesterday?" The student answers in 4 sentences.','Say a present sentence. The student changes it to the past: "I go." → "I went."','Memory game: say 5 things you did on Sunday. The student asks yes/no questions with "Did you…?"'],
  home:'Write 5 sentences about yesterday. Learn 5 new irregular verbs each week.',
  tip:'After "did", the verb goes back to its normal form: "Did you go?" not "Did you went?". Repeat this rule many times.',
  can:'The student tells you about yesterday in 6 sentences with mostly correct past verbs.'});

add({id:'g7', t:'Future: will and going to', goal:'The student can talk about plans and what will happen.',
  teach:[['Time words',['tomorrow','tonight','next week','next month','soon']],
         ['Will',['I will go tomorrow.','She will come on Monday.','I will not go.','Will you come? Yes, I will. No, I will not.']],
         ['Going to (a plan)',['I am going to eat dinner.','He is going to study tonight.','We are going to visit my uncle.']]],
  say:['Tomorrow I will go to the market.','I am going to study tonight.','Will you come? Yes, I will.','She is not going to come.','I will call you soon.'],
  act:['Ask, "What are you going to do tomorrow?" The student answers.','Look at a calendar. Make plans for next week.','Make a promise: "I will practise English every day."'],
  home:'Write your plans for next week in 6 sentences using "will" and "going to".',
  tip:'Do not worry about the small difference between "will" and "going to". Both are fine for now.',
  can:'The student says 6 sentences about plans for tomorrow and next week.'});

/* ===== Stage 8 ===== */
add({id:'h1', t:'Speak for 1 minute without stopping', goal:'The student can talk on one topic for 1 minute.',
  teach:[['Topics',['My family','My day','My house','My favourite food','My best friend','My city']],
         ['Help words (to keep going)',['and','but','because','then','also','so']],
         ['If you are stuck',['Let me think…','Well…','I mean…','Let me say it again…']]],
  say:['Let me tell you about my family.','I like my city because it is big and busy.','Let me think… I also like the food.'],
  act:['Give the student a topic and a timer (1 minute). The student talks. Do not stop the student.','Write the mistakes you hear. Talk about them after the minute.','Do it again with the same topic. The second time is always better. Show the student.'],
  home:'Choose one topic each day. Talk for 1 minute to yourself. Use a phone timer.',
  tip:'Do not correct during the talk. It breaks confidence. Write the mistakes and fix them after.',
  can:'The student talks for 1 minute on a topic in 3 different classes without long stops.'});

add({id:'h2', t:'Tell a short story', goal:'The student can tell a simple story with a beginning, middle and end.',
  teach:[['Story parts',['Beginning: Who? Where?','Middle: What happened?','End: How did it finish?']],
         ['Useful words',['One day…','Then…','Suddenly…','After that…','In the end…']],
         ['Example story',['One day a hungry cat saw a fish. The fish was on a table.','The cat jumped on the table. Then it ate the fish.','In the end, the cat was happy and went to sleep.']]],
  say:['One day a boy went to the market.','Suddenly, it started to rain.','In the end, he went home.'],
  act:['Show 4 pictures. The student tells a story using the pictures.','You say the first sentence. The student says the next. Take turns.','The student tells a story from their own life: "Yesterday I…"'],
  home:'Tell a 6-sentence story to a family member. Use "one day", "then" and "in the end".',

/* ---------- Stages ---------- */
const STAGES = [
 {n:1, id:'st1', t:'Alphabet and Sounds', d:'Learn the letters and their sounds. This is the base for reading and speaking.', ids:['a1','a2','a3','a4','a5','a6'], time:'about 2 to 3 weeks'},
 {n:2, id:'st2', t:'Numbers and Basics', d:'Count, say the days, the months, the colours and the time.', ids:['b1','b2','b3','b4','b5','b6'], time:'about 2 to 3 weeks'},
 {n:3, id:'st3', t:'Greetings and Introduction', d:'Meet people and talk about yourself.', ids:['c1','c2','c3','c4','c5','c6'], time:'about 2 weeks'},
 {n:4, id:'st4', t:'Everyday Words', d:'Learn the words you use every day.', ids:['d1','d2','d3','d4','d5','d6','d7'], time:'about 3 to 4 weeks'},
 {n:5, id:'st5', t:'Simple Sentences', d:'Make complete sentences with be, have, like and want.', ids:['e1','e2','e3','e4','e5','e6'], time:'about 3 weeks'},
 {n:6, id:'st6', t:'Questions', d:'Ask questions and give clear answers.', ids:['f1','f2','f3','f4','f5'], time:'about 2 to 3 weeks'},
 {n:7, id:'st7', t:'Daily Conversation', d:'Use English in real situations: shop, restaurant, road, phone.', ids:['g1','g2','g3','g4','g5','g6','g7'], time:'about 4 weeks'},
 {n:8, id:'st8', t:'Fluency and Confidence', d:'Speak for longer, without fear, and with new people.', ids:['h1','h2','h3','h4','h5','h6'], time:'about 4 or more weeks'}

/* ---------- Teacher guide content ---------- */
const GUIDE = {
  steps:['Open the Speaking Tracker. Look at the Skills Checklist and pick the next skill that is not yet "Mastered".',
         'Find the same code (for example C3) in this lessons file. Teach it using the steps in the lesson.',
         'After class, log the class in the tracker. Give 1 to 5 for speaking, listening, pronunciation and confidence.',
         'Change the skill status in the tracker: Learning → Practising → Mastered. Use the "You can mark it as Mastered when…" box.'],
  plan:[['0–5 min','Warm up','Greet. Ask "How are you?" Review the last lesson with 3 quick questions.'],
        ['5–10 min','Teach','Teach 1 new idea. Say it, show it, act it. Keep it small.'],
        ['10–20 min','Practise','Repeat together. Then the student alone. Use games and real objects.'],
        ['20–27 min','Speak','The student makes their own sentences. Do a mini role play.'],
        ['27–30 min','Finish','Say 3 good things. Give the homework. Say "See you next class."']],
  method:[['1. Listen','The student only listens. You say it 3 times, slowly.'],

          ['3. Repeat alone','The student says it alone. You help only if needed.'],
          ['4. Use it','The student makes a new sentence with their own words.']],
  rules:['One new idea at a time. Do not teach too much.','Speak slowly and clearly. Use short sentences.','Use pictures, objects and actions. Do not only talk.','Repeat many times. Repetition is how we remember.','Correct gently. Say the right sentence and let the student say it again.','Never laugh at mistakes. Mistakes are part of learning.','Praise something real every class.','Speak English in class as much as the student can follow.','Always give a small homework. Ten minutes a day is better than one hour on Sunday.','End each class with something the student can do well.'],
  rating:[['1','Cannot do it, even with help.'],['2','Can do it only with a lot of help.'],['3','Can do it with a little help. Makes mistakes.'],['4','Can do it alone. A few small mistakes.'],['5','Does it easily and correctly, alone.']],
  problems:[['The student is shy','Start with easy things the student knows. Praise every try. Practise together first, alone later. Make the room relaxed.'],
            ['The student forgets things','Review at the start of every class. Use the same sentences often. Ask the student to teach it back to you.'],
            ['The student mixes languages','Tell the student it is OK. Teach the English word. Ask the student to say the sentence again.'],
            ['The pronunciation is not clear','Use a mirror. Show your mouth. Say the sound slowly. Record the student and play it back.'],
            ['The student does not do homework','Make homework very small (5 minutes). Ask for it at the start of class. Link it to something the student likes.'],

  week:[['Day 1','New lesson (teach and practise)'],['Day 2','Review day 1, then the next lesson'],['Day 3','Practise speaking with role play'],['Day 4','New lesson'],['Day 5','Review the week, mini test, game'],['Weekend','Short self-practice, 10 minutes per day']]
};

const CLASSROOM = {
  teacher:[['Hello! How are you?','Greeting'],['Listen.','Ask the student to listen'],['Repeat after me.','The student says it after you'],['Say it again.','The student says it again'],['Slowly, please.','Ask the student to speak slowly'],['Look at this.','Ask the student to look'],['Point to ___.','The student points'],['Open your book.','Instruction'],['Write it down.','The student writes'],['Read this.','The student reads'],['Do you understand?','Check understanding'],['Any questions?','Ask for questions'],['Good!','Praise'],['Very good!','Big praise'],['Well done!','Praise for a good job'],['Try again.','When there is a mistake'],['Nice try.','Kind words when wrong'],['See you next class.','End of class']],
  student:[['Yes, I understand.','You understood'],['I do not understand.','You did not understand'],['Please say it again.','You need to hear it again'],['Please speak slowly.','The teacher is too fast'],['Can I ask a question?','You have a question'],['What does ___ mean?','You do not know a word'],['How do you say ___ in English?','You need a word'],['I am ready.','You are ready to start'],['I am sorry. I forgot.','You forgot homework'],['I finished my homework.','You did the homework'],['Thank you, teacher.','End of class']]
};

/* ---------- Rendering ---------- */
const TABS = [['guide','Start Here'],['lessons','Lessons'],['classroom','Classroom English']];
let tab = 'lessons', stageSel = 1, query = '';

const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';
function speak(text) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.8;
    speechSynthesis.speak(u);
  } catch (e) { /* ignore */ }
}
const sayLine = text => `<div class="say-line">${canSpeak ? `<button type="button" data-say="${esc(text)}" aria-label="Listen: ${esc(text)}">🔊</button>` : ''}<span>${esc(text)}</span></div>`;
const chips = items => `<div class="chips">${items.map(i => `<span class="chip">${esc(i)}</span>`).join('')}</div>`;
const ul = items => `<ul>${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>`;

function teachHTML(teach) {
  if (!teach.length) return '';
  return teach.map(g => {
    if (typeof g === 'string') return `<p>${esc(g)}</p>`;
    const [h, items] = g;
    const list = typeof items === 'string' ? `<p>${esc(items)}</p>`
      : items.every(i => i.length <= 28) ? chips(items) : ul(items);
    return `<div><h3>${esc(h)}</h3>${list}</div>`;
  }).join('');
}

function lessonHTML(l, n, open) {
  return `<details class="lesson" id="lesson-${l.id}"${open ? ' open' : ''}>
    <summary><span class="tag">${l.id.toUpperCase()}</span><span>${esc(l.t)}</span></summary>
    <div class="body">
      <p class="goal"><b>Goal:</b> ${esc(l.goal)}</p>
      <div class="box teach"><h4>What to teach</h4>${teachHTML(l.teach)}</div>
      <div class="box say"><h4>Say it (tap 🔊 to hear)</h4>${l.say.map(sayLine).join('')}</div>
      <div class="box act"><h4>Class activities</h4>${ul(l.act)}</div>
      <div class="box home"><h4>Homework</h4><p>${esc(l.home)}</p></div>
      <p class="small muted"><b>Teacher tip:</b> ${esc(l.tip)}</p>
      <div class="box can"><h4>You can mark it as Mastered when…</h4><p>${esc(l.can)}</p></div>
      <p class="small" style="margin-top:10px"><button class="btn sm" data-print="${l.id}">Print this lesson</button></p>
    </div>
  </details>`;
}

function lessonsView() {
  const q = query.trim().toLowerCase();
  let html = `<div class="tools card" style="padding:12px">
    <input type="search" id="q" placeholder="Search lessons (for example: phone, colours, past)…" value="${esc(query)}" aria-label="Search lessons">
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn sm" data-act="expand">Open all</button><button class="btn sm" data-act="collapse">Close all</button>
    </div></div>`;
  if (q) {
    const hits = Object.values(L).filter(l => JSON.stringify(l).toLowerCase().includes(q));
    html += `<p class="muted small">${hits.length} lesson(s) found.</p>` + (hits.length ? hits.map(l => lessonHTML(l)).join('') : '<div class="card empty">No lessons found. Try another word.</div>');
    return html;
  }
  html += `<div class="stages" role="tablist" aria-label="Stages">${STAGES.map(s => `<button role="tab" data-stage="${s.n}" aria-selected="${s.n === stageSel}">Stage ${s.n}</button>`).join('')}</div>`;
  const s = STAGES.find(x => x.n === stageSel);
  html += `<div class="stage-head"><h2>Stage ${s.n}: ${esc(s.t)}</h2><p>${esc(s.d)}</p><p class="muted small">${s.ids.length} lessons · ${esc(s.time)}</p></div>`;
  html += s.ids.map(id => lessonHTML(L[id])).join('');
  return html;
}

function guideView() {
  return `
  <div class="card"><h2>How to use this with the Speaking Tracker</h2><ol>${GUIDE.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>
    <p class="muted small">Each lesson has a code (A1, B3, C6…). It is the same as the skill in the tracker's Skills Checklist.</p></div>

  <div class="card"><h2>A 30-minute class plan</h2><div class="tablewrap"><table>
    <thead><tr><th>Time</th><th>Part</th><th>What to do</th></tr></thead>
    <tbody>${GUIDE.plan.map(r => `<tr><td>${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div></div>

  <div class="card"><h2>The 4-step teaching method</h2><div class="grid">${GUIDE.method.map(m => `<div class="box teach" style="margin:0"><h4>${esc(m[0])}</h4><p>${esc(m[1])}</p></div>`).join('')}</div></div>

  <div class="card"><h2>10 golden rules for a beginner</h2><ol>${GUIDE.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ol></div>

  <div class="card"><h2>How to give the 1 to 5 rating</h2><div class="tablewrap"><table>
    <thead><tr><th>Score</th><th>What it means</th></tr></thead>
    <tbody>${GUIDE.rating.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted small">Rate the same way every time. Then the graph in the tracker will be honest.</p></div>

  <div class="card"><h2>Common problems and what to do</h2>${GUIDE.problems.map(p => `<h3>${esc(p[0])}</h3><p>${esc(p[1])}</p>`).join('')}</div>

  <div class="card"><h2>An example week</h2><div class="tablewrap"><table>
    <thead><tr><th>Day</th><th>Plan</th></tr></thead>
    <tbody>${GUIDE.week.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div></div>

  <div class="card"><h2>All 8 stages</h2>${STAGES.map(s => `<p><b>Stage ${s.n}: ${esc(s.t)}</b> (${s.ids.length} lessons, ${esc(s.time)})<br><span class="muted small">${esc(s.d)}</span></p>`).join('')}
    <p class="muted small">These times are only a guide. Move at the speed of your student.</p></div>`;
}

function classroomView() {
  const tbl = (rows, a, b) => `<div class="tablewrap"><table><thead><tr><th>${a}</th><th>${b}</th></tr></thead><tbody>${rows.map(r => `<tr><td>${sayLine(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table></div>`;
  return `<div class="card"><h2>Words the teacher uses in class</h2>
    <p class="muted small">Use these words every class. The student will learn them without a lesson.</p>${tbl(CLASSROOM.teacher, 'Say', 'When')}</div>
    <div class="card"><h2>Words the student can use</h2>
    <p class="muted small">Teach these in the first week. They help the student ask for help in English.</p>${tbl(CLASSROOM.student, 'Say', 'When')}</div>`;
}

function render() {
  $('#tabs').innerHTML = TABS.map(([id, label]) => `<button role="tab" data-tab="${id}" aria-selected="${tab === id}">${label}</button>`).join('');
  $('#main').innerHTML = ({guide: guideView, lessons: lessonsView, classroom: classroomView})[tab]();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-stage],[data-say],[data-act],[data-print]');
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (t.dataset.stage) { stageSel = Number(t.dataset.stage); render(); }
  else if (t.dataset.say) speak(t.dataset.say);
  else if (t.dataset.act === 'expand') document.querySelectorAll('details.lesson').forEach(d => d.open = true);
  else if (t.dataset.act === 'collapse') document.querySelectorAll('details.lesson').forEach(d => d.open = false);
  else if (t.dataset.print) {
    const d = document.getElementById('lesson-' + t.dataset.print); if (!d) return;
    d.open = true; d.classList.add('printing'); document.body.classList.add('print-one');
    window.print();
    d.classList.remove('printing'); document.body.classList.remove('print-one');
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    query = e.target.value; const pos = e.target.selectionStart; render();
    const el = $('#q'); el.focus(); el.setSelectionRange(pos, pos);
  }
});

render();
</script>
</body>
</html>
