<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Speaking Course Tracker</title>
<style>
:root{
  --bg:#f5f6fa;--card:#ffffff;--text:#1c2333;--muted:#5d677d;--line:#e3e6ee;
  --brand:#4f46e5;--brand-ink:#ffffff;--brand-soft:#eceeff;
  --ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --s0bg:#e8eaf0;--s0fg:#475066;--s1bg:#fdeab0;--s1fg:#7a4a00;--s2bg:#cfe3ff;--s2fg:#12427f;--s3bg:#bdf0cf;--s3fg:#0d5a2b;
  --box1:#eef4ff;--box2:#eefaf1;--box3:#fff7e6;--box4:#f6efff;
  --c-fluency:#4f46e5;--c-pronunciation:#c2410c;--c-vocabulary:#0e7490;--c-grammar:#be185d;--c-listening:#a16207;--c-confidence:#15803d;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10131c;--card:#1a1f2d;--text:#e8ebf3;--muted:#a3adc2;--line:#2a3144;
    --brand:#8b85ff;--brand-ink:#10131c;--brand-soft:#262b4a;--ok:#5fd68a;--warn:#f0b24d;--bad:#f28b8b;
    --s0bg:#2a3144;--s0fg:#b4bdd1;--s1bg:#4a3a10;--s1fg:#fbd77a;--s2bg:#1c3a63;--s2fg:#a9cdff;--s3bg:#15472b;--s3fg:#9be9b5;
    --box1:#17233f;--box2:#142a1d;--box3:#33270f;--box4:#251a38;
    --c-fluency:#9a95ff;--c-pronunciation:#ff9a5c;--c-vocabulary:#4fc3dc;--c-grammar:#f472b6;--c-listening:#e5b94a;--c-confidence:#5fd68a;
  }
}
:root[data-theme="dark"]{
  --bg:#10131c;--card:#1a1f2d;--text:#e8ebf3;--muted:#a3adc2;--line:#2a3144;
  --brand:#8b85ff;--brand-ink:#10131c;--brand-soft:#262b4a;--ok:#5fd68a;--warn:#f0b24d;--bad:#f28b8b;
  --s0bg:#2a3144;--s0fg:#b4bdd1;--s1bg:#4a3a10;--s1fg:#fbd77a;--s2bg:#1c3a63;--s2fg:#a9cdff;--s3bg:#15472b;--s3fg:#9be9b5;
  --box1:#17233f;--box2:#142a1d;--box3:#33270f;--box4:#251a38;
  --c-fluency:#9a95ff;--c-pronunciation:#ff9a5c;--c-vocabulary:#4fc3dc;--c-grammar:#f472b6;--c-listening:#e5b94a;--c-confidence:#5fd68a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}.small{font-size:13px}
header.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.student-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:70px}
select{width:auto;min-width:150px;max-width:100%}
select.full{width:100%}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat .v{font-size:25px;font-weight:700;line-height:1.2}.stat .l{font-size:13px;color:var(--muted)}
.row2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.topics{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.bar{height:10px;border-radius:99px;background:var(--s0bg);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.lvl-row{display:grid;grid-template-columns:minmax(150px,260px) 1fr 70px;gap:10px;align-items:center;margin:8px 0}
.chip{border:0;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.s0{background:var(--s0bg);color:var(--s0fg)}.chip.s1{background:var(--s1bg);color:var(--s1fg)}.chip.s2{background:var(--s2bg);color:var(--s2fg)}.chip.s3{background:var(--s3bg);color:var(--s3fg)}
.chip.static{cursor:default}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;width:100%;display:block}
.tcard:hover{border-color:var(--brand)}
.tcard.next{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.tcard .no{font-size:12px;color:var(--muted);font-weight:700}
.tcard .tt{font-weight:700;font-size:16px;margin:2px 0 8px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.filters button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.box{border-radius:12px;padding:12px 14px;margin-top:12px}
.box h3{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.b1{background:var(--box1)}.b2{background:var(--box2)}.b3{background:var(--box3)}.b4{background:var(--box4)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 10px;cursor:pointer;font-size:14px}
.say-line{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.spk{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;padding:0 8px;line-height:26px}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.qrow:first-of-type{border-top:0}
.qb{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:16px;background:var(--s0bg);color:var(--s0fg)}
.qb.q1{background:var(--s1bg);color:var(--s1fg);border-color:transparent}
.qb.q2{background:var(--s3bg);color:var(--s3fg);border-color:transparent}
.qt{flex:1;padding-top:4px}
.tier{margin-top:14px}
.tier h3{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.rating button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hint{font-size:12px;color:var(--muted);min-height:18px;margin-top:2px}
.session{border-top:1px solid var(--line);padding:12px 0}.session:first-child{border-top:0}
.session-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;border-radius:99px;padding:2px 10px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.pill.ok{background:var(--s3bg);color:var(--s3fg)}.pill.warn{background:var(--s1bg);color:var(--s1fg)}.pill.bad{background:#fbd5d5;color:#7f1d1d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.bad{background:#4a1d1d;color:#ffb4b4}}
:root[data-theme="dark"] .pill.bad{background:#4a1d1d;color:#ffb4b4}
.notes{margin-top:6px;font-size:14px;white-space:pre-wrap}
.err{color:var(--bad);font-size:13px;min-height:18px}
.banner{background:var(--s1bg);color:var(--s1fg);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.empty{text-align:center;padding:40px 16px}
svg.chart{width:100%;height:auto;display:block}
svg .ax{fill:var(--muted);font-size:11px}svg .gl{stroke:var(--line);stroke-width:1}
.field{margin-bottom:12px}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.pcard{text-align:center;padding:26px 18px}
.pq{font-size:24px;line-height:1.35;font-weight:700;margin:12px 0 16px}
.timer{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tabs-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.print-only{display:none}
@media print{
  body{background:#fff;color:#000}
  .no-print,nav.tabs,.student-bar,.btn,.spk,.qb{display:none!important}
  .print-only{display:block}
  .card,.stat,.box{break-inside:avoid;border-color:#bbb}
  .qb.q1,.qb.q2{display:inline-block!important}
}
@media (max-width:560px){
  .lvl-row{grid-template-columns:1fr 70px}.lvl-row .bar{grid-column:1/3;order:3}
  .pq{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top no-print">
    <div>
      <h1>English Speaking Course Tracker</h1>
      <div class="muted small">46 topics · 6 levels · 920 speaking questions · Basics to Advanced</div>
    </div>
    <div class="student-bar">
      <label for="studentSel" class="muted small" style="margin:0">Student</label>
      <select id="studentSel" aria-label="Select student"></select>
      <button class="btn" data-act="new-student">+ New student</button>
    </div>
  </header>
  <div id="banner"></div>
  <nav class="tabs no-print" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<dialog id="studentDlg">
  <form data-form="student" method="dialog">
    <h2 id="dlgTitle">New student</h2>
    <div class="field"><label for="f-name">Name *</label><input type="text" id="f-name" name="name" required maxlength="80"></div>
    <div class="field"><label for="f-start">Start date</label><input type="date" id="f-start" name="start"></div>
    <div class="field" id="f-level-wrap"><label for="f-level">Starting level</label><select id="f-level" name="level" class="full"></select>
      <div class="hint">All topics in lower levels will be marked "Mastered". You can change them later.</div></div>
    <div class="field"><label for="f-goal">Goal</label><input type="text" id="f-goal" name="goal" maxlength="200" placeholder="e.g. Job interview, travel, daily conversation"></div>
    <div class="field"><label for="f-notes">Notes about the student</label><textarea id="f-notes" name="notes" maxlength="1000"></textarea></div>
    <div class="actions"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn primary" value="ok">Save</button></div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= DATA ================= */
const TOPICS = [];
// T(number, level, title, goal, vocab, key sentences, questions, role play, homework)
const T = (n, l, t, g, v, k, q, r, h) => TOPICS.push({
  n, id: 't' + String(n).padStart(2, '0'), level: l, title: t, goal: g,
  vocab: v.split(',').map(s => s.trim()).filter(Boolean),
  key: k.split('\n').map(s => s.trim()).filter(Boolean),
  q: q.split('\n').map(s => s.trim()).filter(Boolean),
  role: r, home: h
});
/* LEVEL 1 · STARTER (A1) — questions: 1-7 warm-up, 8-15 talk, 16-20 challenge */
T(1,1,`Introducing Yourself`,`Say who you are and share basic facts about yourself.`,
`name, age, country, city, job, student, married, single, language, nationality`,
`My name is ___.
I am ___ years old.
I am from ___.
I work as a ___. / I study ___.
I can speak ___ and ___.`,
`What is your name?
How do you spell your name?
How old are you?
Where are you from?
Where do you live now?
What languages do you speak?
Are you a student or do you work?
Can you introduce yourself in five sentences?
What do you do every day?
Tell me about your city or town.
Why do you want to learn English?
What do you like to do in your free time?
What is your favourite food? Why?
Who is the most important person in your life? Why?
What is one thing you are good at?
What are three things people should know about you?
What was your best day this year? What happened?
How do you want your life to be in five years?
What makes you happy?
Introduce a friend to me. Tell me about him or her.`,
`Meet a new person at a party. Say hello, give your name, and ask 4 questions about them.`,
`Record a one-minute talk called "About me". Listen to it and find 3 things to improve.`);

T(2,1,`Greetings and Small Talk`,`Start and keep a short, friendly conversation.`,
`hello, how are you, nice to meet you, see you later, weekend, busy, weather, tired, great, take care`,
`How are you? — I am fine, thanks. And you?
Nice to meet you.
How was your weekend?
It is a lovely day, isn't it?
See you later!`,
`Hello! How are you today?
How is your day going?
Are you busy this week?
How was your weekend?
What did you have for breakfast today?
Is it hot or cold today?
Do you like Mondays?
What do you do when you meet a new person?
How do you greet your teacher? Your friend? Your boss?
What can you say to start a conversation with a stranger?
What do you talk about with your neighbours?
How do you say goodbye in different situations?
What is a good question to ask someone at a party?
What was the best part of your last weekend?
What do you usually do on the weekend?
Why is small talk important?
Start a small talk with me about the weather.
You meet your friend after one year. What do you say?
You are in a lift with your boss. What do you say?
Is it easy or difficult for you to talk to new people? Why?`,
`Meet a neighbour in the lift. Start a small talk about the weather and the weekend.`,
`Start a small talk with 2 people this week. Write down what you said.`);

T(3,1,`Family and Friends`,`Talk about the people who are close to you.`,
`parents, brother, sister, cousin, grandparents, uncle, aunt, husband, wife, neighbour, best friend`,
`I have two brothers and one sister.
My father works as a ___.
She is older than me.
We spend time together on weekends.
He is my best friend because ___.`,
`How many people are in your family?
Do you have brothers or sisters?
What is your mother's name?
What does your father do?
Who is the oldest person in your family?
Who is your best friend?
Do you live with your family?
Tell me about your family.
Who are you closest to in your family? Why?
What do you do with your family on weekends?
Tell me about your best friend. What is he or she like?
How did you meet your best friend?
What do you and your friends do together?
Describe your grandparents.
What is a family tradition in your home?
What makes a good friend?
Is it better to live in a big family or a small family? Why?
Tell me about a happy family memory.
Who has influenced you the most? How?
How have your friendships changed since you were a child?`,
`Show a family photo to a friend and tell them about each person.`,
`Tell a family member about your best friend in English. Speak for one minute.`);

T(4,1,`Numbers, Dates and Time`,`Talk about time, dates, prices and numbers in real life.`,
`o'clock, half past, quarter past, birthday, month, date, week, year, price, phone number, appointment`,
`It is half past six.
My birthday is on the 5th of March.
My phone number is ___.
The meeting is at three o'clock.
It costs two hundred rupees.`,
`What time is it now?
What is today's date?
What day was yesterday?
When is your birthday?
What is your phone number?
How many months are there in a year?
What time do you wake up?
What time do you start and finish your day?
What is your favourite month? Why?
How do you remember important dates?
What time do you usually eat lunch and dinner?
What do you do at 8 o'clock in the evening?
Tell me the dates of three important days in your year.
How many hours do you sleep every night?
How much time do you spend on your phone every day?
Are you a person who is always on time? Why or why not?
Tell me about a time you were late. What happened?
What is the most important day of your life? Why?
If you had a free hour every day, what would you do?
What is the best time of day for learning? Why?`,
`Call a doctor's office to make an appointment. Give the day, the date and the time.`,
`Say today's date and the time aloud 3 times a day. Write 5 important dates in English.`);

T(5,1,`My Home and Things Around Me`,`Describe your home, your room and the things in them.`,
`living room, kitchen, bedroom, bathroom, balcony, sofa, fridge, cupboard, floor, roof, neighbourhood`,
`There is a ___ in my room.
The kitchen is next to the living room.
My favourite room is ___ because ___.
I live in a flat. / I live in a house.
There are three rooms in my home.`,
`Do you live in a house or a flat?
How many rooms are there in your home?
What is in your bedroom?
What is your favourite room?
Do you have a garden or a balcony?
What colour are the walls in your room?
Who lives with you?
Describe your home to me.
Describe your bedroom. What is in it?
What do you do in the kitchen?
Tell me about your neighbourhood.
What do you like about your home? What do you not like?
What things in your room are very important to you?
How do you keep your home clean?
Who does the housework in your home?
Describe your dream home.
Would you rather live in a city flat or a village house? Why?
If you could change one thing in your home, what would it be?
What is the first thing you notice when you enter a home?
What makes a house feel like a home?`,
`You show a visitor around your home. Describe each room.`,
`Walk through your home and say what you see in each room, aloud, in English.`);

T(6,1,`Daily Routine`,`Talk about what you do every day, in order.`,
`wake up, get up, brush, breakfast, commute, work, study, relax, dinner, go to bed, always, usually, sometimes, never`,
`I usually wake up at ___.
After that, I ___.
I never ___ on Sundays.
Then I go to work by bus.
In the evening, I ___.`,
`What time do you usually get up on Sundays?
What do you do first in the morning?
How do you go to work or school?
What time do you have lunch?
What time do you go to bed?
Do you drink tea or coffee in the morning?
Do you exercise every day?
Tell me about your morning routine.
Describe a normal weekday from morning to night.
How is your weekend different from a weekday?
What do you do in the evening to relax?
What is the best part of your day? Why?
What is the most difficult part of your day?
What do you always do before you sleep?
What do you never do on Sundays?
If you could change one thing in your routine, what would it be?
Are you a morning person or a night person? Explain.
What is the perfect day for you? Describe it from morning to night.
What habits do you want to start? Why?
How does your routine affect your mood?`,
`A friend asks about your day. Describe it from morning to night.`,
`Talk about your day for one minute every night this week.`);

T(7,1,`Food and Drink`,`Talk about what you eat, cook and like.`,
`breakfast, lunch, dinner, snack, spicy, sweet, sour, delicious, vegetarian, recipe, cook, hungry, thirsty`,
`I like ___ because it is ___.
I usually have ___ for breakfast.
It tastes ___.
First, I ___. Then I ___.
I cannot eat ___ because ___.`,
`What did you eat for breakfast today?
What is your favourite food?
What do you like to drink?
Do you like spicy food?
Can you cook?
What do you not like to eat?
How many meals do you have in a day?
What do you usually eat in a normal day?
Tell me about a traditional dish from your country.
How do you make your favourite dish?
Do you prefer home food or restaurant food? Why?
What snacks do you eat?
Describe the taste of your favourite food.
Who cooks at your home?
What do you eat on special days or festivals?
Is fast food bad for you? Give reasons.
What is the best meal you have ever had? Tell the story.
What would you cook for a guest from another country?
Is it important to eat together as a family? Why?
How is the food in your country different from other countries?`,
`Invite a friend for dinner. Ask what food he or she likes and say what you will cook.`,
`Explain to a friend how to make one dish. Speak for one minute.`);

T(8,1,`Likes, Dislikes and Hobbies`,`Talk about what you enjoy and what you do in your free time.`,
`hobby, enjoy, prefer, favourite, boring, exciting, free time, sport, music, movies, reading, travelling, painting`,
`I enjoy ___ing.
I am interested in ___.
I prefer ___ to ___.
I do not like ___ because ___.
My favourite ___ is ___.`,
`What do you do in your free time?
What is your favourite hobby?
Do you like sports?
What kind of music do you like?
Do you like watching movies?
What is your favourite colour?
What do you not like doing?
Tell me about your favourite hobby.
When did you start this hobby? How?
Who do you do your hobby with?
What kind of movies do you enjoy? Why?
Tell me about your favourite singer or actor.
Do you prefer being at home or going out? Why?
How do you spend your Sundays?
What new hobby do you want to try?
Are hobbies important in life? Explain.
Which is better: indoor or outdoor hobbies?
Describe a time when your hobby gave you a good experience.
Can a hobby become a job? Give your opinion.
How do hobbies change when people grow older?`,
`Find out what hobbies a new friend has. Ask 5 questions and then suggest an activity.`,
`Talk for one minute about your favourite hobby. Record it.`);

/* LEVEL 2 · ELEMENTARY (A2) */
T(9,2,`Describing People`,`Describe how people look and what they are like.`,
`tall, short, slim, curly, straight, beard, kind, funny, shy, friendly, polite, lazy, hard-working`,
`He is tall and slim.
She has long black hair.
He is a very kind person.
She looks like her mother.
He is good at ___.`,

const sortedSessions = st => [...st.sessions].sort((a, b) => a.date === b.date ? a.id.localeCompare(b.id) : a.date.localeCompare(b.date));

function streakOf(sessions) {
  const set = new Set(sessions.map(s => s.date)); const d = new Date();
  if (!set.has(isoOf(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (set.has(isoOf(d))) { n++; d.setDate(d.getDate() - 1); } return n;
}
function topicStats(st, t) {
  const x = getT(st, t.id); let well = 0, work = 0;
  for (let i = 0; i < t.q.length; i++) { if (x.qs[i] === 2) well++; else if (x.qs[i] === 1) work++; }
  return {well, work, total: t.q.length, status: x.status};
}
function levelStats(st) {
  return LEVELS.map(L => {
    const ts = TOPICS.filter(t => t.level === L.n);
    const pts = ts.reduce((a, t) => a + getT(st, t.id).status, 0);
    const mastered = ts.filter(t => getT(st, t.id).status === 3).length;
    return {L, count: ts.length, mastered, pct: Math.round(pts / (3 * ts.length) * 100)};
  });
}
function overall(st) {
  const pts = TOPICS.reduce((a, t) => a + getT(st, t.id).status, 0);
  const mastered = TOPICS.filter(t => getT(st, t.id).status === 3).length;
  let well = 0, asked = 0;
  TOPICS.forEach(t => { const s = topicStats(st, t); well += s.well; asked += s.well + s.work; });
  return {pct: Math.round(pts / (3 * TOPICS.length) * 100), mastered, well, asked};
}
const nextTopic = st => TOPICS.find(t => getT(st, t.id).status < 3) || null;

  for (const [d, c] of Object.entries(st.qLog)) { const k = daysBetween(t, d); if (k >= 0 && k < 7) n += c; }

}

function chartHTML(ss) {

  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of the last ${n} classes, six ratings out of 5">${g}${xl}${series}</svg>

function practicePool(st) {
  const pool = [];
  for (const t of TOPICS) {
    if (pr.scope !== 'all' && pr.scope !== t.id && pr.scope !== 'L' + t.level) continue;
    const x = getT(st, t.id);
    t.q.forEach((_, i) => {
      if (pr.tier !== 'all' && tierOf(i).name !== pr.tier) return;
      const v = x.qs[i] || 0;
      if (pr.mode === 'new' && v === 2) return;
      if (pr.mode === 'work' && v !== 1) return;
      if (pr.mode === 'unasked' && v !== 0) return;
      pool.push({id: t.id, i});
    });
  }
  return pool;
}

  let c = pool[shuffleIdx(pool.length)];
  if (pool.length > 1 && pr.current) { let tries = 0; while (c.id === pr.current.id && c.i === pr.current.i && tries++ < 8) c = pool[shuffleIdx(pool.length)]; }
  pr.current = c; return pool.length;
}

  const c = pr.current, t = c ? TMAP[c.id] : null;

  const card = c ? `<div class="card pcard">

        <div class="tabs-row"><button class="btn sm" data-act="timer" data-s="30">30 sec</button><button class="btn sm" data-act="timer" data-s="60">1 min</button>
        <button class="btn sm" data-act="timer" data-s="120">2 min</button><button class="btn sm" data-act="timer" data-s="0">Stop</button></div></div>
    </div>
    <div class="card"><h3>Follow-up questions to keep the student talking</h3>
      <div class="chips">${FOLLOW_UPS.map(f => `<button type="button" class="vchip" data-say="${esc(f)}">${canSpeak ? '🔊 ' : ''}${esc(f)}</button>`).join('')}</div></div>`
    : `<div class="card empty"><h2>No questions in this selection</h2><p class="muted">Try "Any question" in the "Which questions" box, or choose another topic or level.</p></div>`;
  return `<div class="card"><h2>Speaking practice</h2>
    <p class="muted small" style="margin-top:0">The app picks a question. Ask it, listen to the answer, then mark it. This is the fastest way to build speaking skill.</p>
    <div class="grid row2">
      <div><label for="p-scope">Topics</label><select id="p-scope" class="full" data-pr="scope">${scopeOptions()}</select></div>
      <div><label for="p-tier">Question type</label><select id="p-tier" class="full" data-pr="tier">
        ${[['all','All types'], ...TIERS.map(x => [x.name, x.name + ' – ' + x.hint])].map(([k, l]) => `<option value="${k}"${pr.tier === k ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select></div>
      <div><label for="p-mode">Which questions</label><select id="p-mode" class="full" data-pr="mode">
        ${[['new','New and needs more work'],['unasked','Not asked yet'],['work','Needs more work only'],['any','Any question']].map(([k, l]) => `<option value="${k}"${pr.mode === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="small muted" style="margin-top:8px">${size ? size + ' question(s) in this selection' : ''} · Marked in this visit: ${pr.doneNow} · Practised today: ${st.qLog[today()] || 0}</div>
  </div>${card}`;
}

/* ---------- Class log ---------- */
function ratingGroup(key) {
  const cur = formRatings[key];
  return `<div class="field"><label>${esc(LABELS[key])}</label>
    <div class="rating">${[1,2,3,4,5].map(n => `<button type="button" data-act="rate" data-key="${key}" data-val="${n}" aria-pressed="${cur === n}" aria-label="${esc(SHORT[key])} ${RATE_HINT[n]}">${n}</button>`).join('')}</div>
    <div class="hint" data-hint="${key}">${cur ? RATE_HINT[cur] : ''}</div></div>`;
}
function topicSelect(selected, id, name) {
  return `<select id="${id}" name="${name}" class="full"><option value="">— Choose a topic —</option>
    ${LEVELS.map(L => `<optgroup label="Level ${L.n} · ${esc(L.name)}">${TOPICS.filter(t => t.level === L.n).map(t => `<option value="${t.id}"${selected === t.id ? ' selected' : ''}>${t.n}. ${esc(t.title)}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
function logHTML(st) {
  const ed = editingSession ? st.sessions.find(s => s.id === editingSession) : null;
  const v = ed || {date: today(), minutes: 30, topic: logTopic, other: '', qCount: st.qLog[today()] || 0, homework: 'na', notes: '', next: ''};
  const list = sortedSessions(st).reverse();
  return `<div class="card"><h2>${ed ? 'Edit class' : 'Log today\'s class'}</h2>
    <form data-form="session" novalidate>
      <div class="grid row2">
        <div class="field"><label for="s-date">Date</label><input type="date" id="s-date" name="date" value="${esc(v.date)}" required></div>
        <div class="field"><label for="s-min">Minutes</label><input type="number" id="s-min" name="minutes" min="1" max="600" value="${esc(v.minutes)}" required></div>
        <div class="field"><label for="s-q">Speaking questions practised</label><input type="number" id="s-q" name="qCount" min="0" max="500" value="${esc(v.qCount)}"></div>
        <div class="field"><label for="s-hw">Previous homework</label><select id="s-hw" name="homework" class="full">${Object.entries(HW).map(([k, l]) => `<option value="${k}"${v.homework === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      </div>
      <div class="grid row2">
        <div class="field"><label for="s-topic">Topic taught</label>${topicSelect(v.topic, 's-topic', 'topic')}</div>
        <div class="field"><label for="s-other">Or other topic (free text)</label><input type="text" id="s-other" name="other" maxlength="200" value="${esc(v.other)}" placeholder="Anything not in the list"></div>
      </div>
      <div class="grid row2">${RK.map(ratingGroup).join('')}</div>
      <div class="field"><label for="s-notes">Teacher notes (what went well, mistakes to fix)</label><textarea id="s-notes" name="notes" maxlength="2000">${esc(v.notes)}</textarea></div>
      <div class="field"><label for="s-next">Plan for the next class</label><textarea id="s-next" name="next" maxlength="1000">${esc(v.next)}</textarea></div>
      <div class="err" id="sessErr" role="alert"></div>
      <div class="actions">${ed ? '<button type="button" class="btn" data-act="cancel-edit">Cancel</button>' : ''}<button class="btn primary" type="submit">${ed ? 'Update class' : 'Save class'}</button></div>
    </form></div>
  <div class="card"><h2>Past classes (${list.length})</h2>
    ${list.length ? list.map(s => { const tp = TMAP[s.topic]; return `<div class="session">
      <div class="session-head"><div><b>${esc(fmtDate(s.date))}</b> · ${s.minutes} min · <span class="muted">${esc(tp ? tp.n + '. ' + tp.title : s.other || 'No topic')}</span></div>
        <div><button class="btn sm" data-act="edit-session" data-id="${esc(s.id)}">Edit</button> <button class="btn sm danger" data-act="del-session" data-id="${esc(s.id)}">Delete</button></div></div>
      <div class="pills"><span class="pill">Average ${sessionAvg(s).toFixed(1)}/5</span>${RK.map(k => `<span class="pill">${esc(SHORT[k])} ${s[k]}</span>`).join('')}
        ${s.qCount ? `<span class="pill">${s.qCount} questions</span>` : ''}<span class="pill ${HW_CLASS[s.homework]}">${HW[s.homework]}</span></div>
      ${s.notes ? `<div class="notes">${esc(s.notes)}</div>` : ''}${s.next ? `<div class="notes muted"><b>Next:</b> ${esc(s.next)}</div>` : ''}</div>`; }).join('') : '<p class="muted">No classes logged yet.</p>'}
  </div>`;
}

/* ---------- Backup & settings ---------- */
function moreHTML(st) {
  return `<div class="card"><h2>Student profile</h2>
    <p><b>${esc(st.name)}</b><br><span class="muted small">Started: ${esc(fmtDate(st.start))}${st.goal ? '<br>Goal: ' + esc(st.goal) : ''}${st.notes ? '<br>Notes: ' + esc(st.notes) : ''}</span></p>
    <button class="btn" data-act="edit-student">Edit profile</button></div>
  <div class="card"><h2>Set the starting level</h2>
    <p class="muted small">If the student already knows the basics, mark all topics below a level as Mastered. Topics that are already marked will not be changed down.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="skipLevel" aria-label="Start from level">${LEVELS.map(L => `<option value="${L.n}">Start from Level ${L.n} · ${esc(L.name)}</option>`).join('')}</select>
    <button class="btn" data-act="skip-levels">Apply</button></div></div>
  <div class="card"><h2>Backup (please do this often)</h2>
    <p class="muted small">Your data is saved only in this browser. If you clear browser data or change the computer, it will be lost. Download a backup every week and keep the file safe.</p>
    <div class="actions" style="justify-content:flex-start"><button class="btn primary" data-act="export">Download backup (.json)</button>
      <label class="btn" style="margin:0;cursor:pointer">Restore backup<input type="file" id="importFile" accept="application/json,.json" style="display:none"></label></div></div>
  <div class="card"><h2>Theme</h2><div class="actions" style="justify-content:flex-start">
    <button class="btn" data-act="theme" data-id="auto">Auto</button><button class="btn" data-act="theme" data-id="light">Light</button><button class="btn" data-act="theme" data-id="dark">Dark</button></div></div>
  <div class="card"><h2>Danger zone</h2><button class="btn danger" data-act="del-student">Delete all data of this student</button></div>`;
}

/* ================= ACTIONS ================= */
function bumpQ(st) { const d = today(); st.qLog[d] = (st.qLog[d] || 0) + 1; }
function setQ(st, tid, i, v) {
  const x = ensureT(st, tid);
  if (v) { x.qs[i] = v; x.last = today(); if (x.status === 0) x.status = 1; bumpQ(st); } else delete x.qs[i];
}
const actions = {
  'tab': b => { tab = b.dataset.id; if (tab !== 'topics') openTopic = null; render(); window.scrollTo(0, 0); },
  'new-student': () => openStudentDlg('new'),
  'edit-student': () => openStudentDlg('edit'),
  'lvl': b => { lvlFilter = Number(b.dataset.id); render(); },
  'open-topic': b => { tab = 'topics'; openTopic = b.dataset.id; render(); window.scrollTo(0, 0); },
  'close-topic': () => { openTopic = null; render(); window.scrollTo(0, 0); },
  'status': b => { const x = ensureT(active(), b.dataset.id); x.status = Number(b.dataset.v); if (x.status > 0) x.last = today(); save(); render(); },
  'q': b => {
    const st = active(), x = getT(st, b.dataset.id), i = Number(b.dataset.i);
    setQ(st, b.dataset.id, i, ((x.qs[i] || 0) + 1) % 3); save(); render();
  },
  'practice-topic': b => { pr.scope = b.dataset.id; pr.current = null; pr.mode = 'any'; tab = 'practice'; render(); window.scrollTo(0, 0); },
  'log-topic': b => { logTopic = b.dataset.id; editingSession = null; resetRatings(); tab = 'log'; render(); window.scrollTo(0, 0); },
  'p-well': () => practiceMark(2),
  'p-work': () => practiceMark(1),
  'p-skip': () => { pickQuestion(active()); render(); },
  'timer': b => startTimer(Number(b.dataset.s)),
  'rate': b => {
    const k = b.dataset.key, n = Number(b.dataset.val); formRatings[k] = n;
    b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(Number(x.dataset.val) === n)));
    $(`[data-hint="${k}"]`).textContent = RATE_HINT[n];
  },
  'edit-session': b => {
    const s = active().sessions.find(x => x.id === b.dataset.id); if (!s) return;
    editingSession = s.id; formRatings = Object.fromEntries(RK.map(k => [k, s[k]])); render(); window.scrollTo(0, 0);
  },
  'cancel-edit': () => { editingSession = null; resetRatings(); render(); },
  'del-session': b => {
    if (!confirm('Delete this class?')) return;
    const st = active(); st.sessions = st.sessions.filter(x => x.id !== b.dataset.id);
    if (editingSession === b.dataset.id) { editingSession = null; resetRatings(); }
    save(); render();
  },
  'skip-levels': () => {
    const lv = Number($('#skipLevel').value), st = active();
    if (lv <= 1) return toast('Level 1 is the start. Nothing to change.');
    if (!confirm(`Mark all topics in Levels 1 to ${lv - 1} as Mastered for ${st.name}?`)) return;
    TOPICS.filter(t => t.level < lv).forEach(t => { const x = ensureT(st, t.id); x.status = 3; if (!x.last) x.last = today(); });
    save(); render(); toast('Starting level updated');
  },
  'del-student': () => {
    const st = active();
    if (!confirm(`All data for "${st.name}" (classes, topics, questions) will be deleted for good. Did you take a backup?`)) return;
    if (!confirm('Are you sure? This cannot be undone.')) return;
    db.students = db.students.filter(s => s.id !== st.id); db.activeId = db.students[0] ? db.students[0].id : null;
    tab = 'dash'; openTopic = null; save(); render(); toast('Student deleted');
  },
  'export': () => {
    const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `english-course-backup-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup downloaded');
  },
  'theme': b => {
    const t = b.dataset.id;
    if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    try { t === 'auto' ? localStorage.removeItem(KEY + '.theme') : localStorage.setItem(KEY + '.theme', t); } catch (e) { /* ignore */ }
  },
  'print': () => window.print()
};
function practiceMark(v) {
  const st = active(), c = pr.current; if (!c) return;
  setQ(st, c.id, c.i, v); pr.doneNow++; save(); pickQuestion(st); render();
}
function startTimer(sec) {
  clearInterval(timerId); timerId = null;
  const el = $('#timer'); if (!el) return;
  const fmt = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
  if (!sec) { el.textContent = '0:00'; return; }
  let left = sec; el.textContent = fmt(left);
  timerId = setInterval(() => {
    left--; const e = $('#timer'); if (e) e.textContent = fmt(Math.max(left, 0));
    if (left <= 0) { clearInterval(timerId); timerId = null; toast('Time is up!'); }
  }, 1000);
}

document.addEventListener('click', e => {
  const sayEl = e.target.closest('[data-say]');
  if (sayEl) { speak(sayEl.dataset.say); return; }
  const b = e.target.closest('[data-act]');
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b, e);
});

/* ================= FORMS ================= */
const dlg = $('#studentDlg');
function openStudentDlg(mode) {
  dlgMode = mode; const st = mode === 'edit' ? active() : null;
  $('#dlgTitle').textContent = st ? 'Edit profile' : 'New student';
  $('#f-name').value = st ? st.name : ''; $('#f-start').value = st ? st.start : today();
  $('#f-goal').value = st ? st.goal : ''; $('#f-notes').value = st ? st.notes : '';
  $('#f-level').innerHTML = LEVELS.map(L => `<option value="${L.n}">Level ${L.n} · ${esc(L.name)} (${esc(L.cefr)})</option>`).join('');
  $('#f-level-wrap').style.display = st ? 'none' : '';
  dlg.showModal(); $('#f-name').focus();
}
document.addEventListener('submit', e => {
  const f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault(); const fd = new FormData(f);
  if (kind === 'student') {
    const name = String(fd.get('name') || '').trim(); if (!name) return;
    const start = okDate(fd.get('start')) ? fd.get('start') : today();
    if (dlgMode === 'edit' && active()) Object.assign(active(), {name, start, goal: String(fd.get('goal') || '').trim(), notes: String(fd.get('notes') || '').trim()});
    else {
      const s = normStudent({name, start, goal: fd.get('goal'), notes: fd.get('notes')});
      const lv = clamp(Math.round(num(fd.get('level'))) || 1, 1, 6);
      TOPICS.filter(t => t.level < lv).forEach(t => { ensureT(s, t.id).status = 3; });
      db.students.push(s); db.activeId = s.id; tab = 'dash'; openTopic = null;
    }
    dlg.close(); save(); render(); toast('Saved');
  } else if (kind === 'session') {
    const err = $('#sessErr'), date = String(fd.get('date') || ''), minutes = Math.round(num(fd.get('minutes')));
    const topic = TMAP[fd.get('topic')] ? String(fd.get('topic')) : '', other = String(fd.get('other') || '').trim();
    if (!okDate(date)) return void (err.textContent = 'Please enter a valid date.');
    if (minutes < 1) return void (err.textContent = 'Minutes must be 1 or more.');
    if (!topic && !other) return void (err.textContent = 'Choose a topic or write what you taught.');
    if (RK.some(k => !formRatings[k])) return void (err.textContent = 'Please give all six ratings (1 to 5).');
    const hw = String(fd.get('homework'));
    const rec = {id: editingSession || uid(), date, minutes, topic, other, qCount: Math.max(0, Math.round(num(fd.get('qCount')))),
      homework: ['done','partly','no','na'].includes(hw) ? hw : 'na', ...formRatings,
      notes: String(fd.get('notes') || '').trim(), next: String(fd.get('next') || '').trim()};
    const st = active();
    if (editingSession) st.sessions = st.sessions.map(s => s.id === editingSession ? rec : s); else st.sessions.push(rec);
    if (topic && !editingSession) { const x = ensureT(st, topic); x.last = date; if (x.status === 0) x.status = 1; }
    editingSession = null; logTopic = ''; resetRatings(); save(); render(); toast('Class saved');
  }
});
dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'studentSel') { db.activeId = el.value; editingSession = null; openTopic = null; resetRatings(); pr.current = null; save(); render(); }
  else if (el.dataset.pr) { pr[el.dataset.pr] = el.value; pr.current = null; render(); }
  else if (el.dataset.notesFor) { ensureT(active(), el.dataset.notesFor).notes = el.value.slice(0, 2000); save(); toast('Notes saved'); }
  else if (el.id === 'importFile') {
    const file = el.files && el.files[0]; if (!file) return; const rd = new FileReader();
    rd.onload = () => {
      try {
        const parsed = JSON.parse(String(rd.result));
        if (!parsed || !Array.isArray(parsed.students)) throw new Error('bad');
        const incoming = normDb(parsed);
        if (!confirm(`This file has ${incoming.students.length} student(s). It will replace all current data. Continue?`)) return;
        db = incoming; tab = 'dash'; openTopic = null; save(); render(); toast('Backup restored');
      } catch (err) { alert('This does not look like a valid backup file.'); }
    };
    rd.readAsText(file); el.value = '';
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'tsearch') {
    topicSearch = e.target.value; const pos = e.target.selectionStart; render();
    const el = $('#tsearch'); el.focus(); el.setSelectionRange(pos, pos);
  }
});

/* ================= INIT ================= */
try { const t = localStorage.getItem(KEY + '.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) { /* ignore */ }
render();
</script>
</body>
</html>
